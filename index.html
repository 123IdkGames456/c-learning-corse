<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#302b53,transparent 42%),var(--bg);color:var(--text);font:21px/1.85 system-ui,"Segoe UI",sans-serif;letter-spacing:.01em}.app{max-width:1450px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}.brand{display:flex;align-items:center;gap:13px;font-size:22px;font-weight:900;line-height:1.2}.logo{width:49px;height:49px;border-radius:15px;background:linear-gradient(135deg,var(--purple),var(--mint));display:grid;place-items:center;color:#17172b;font-weight:1000}.muted{color:var(--muted)}.small{font-size:15px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:23px}.side{height:max-content;position:sticky;top:15px;padding:15px;border:1px solid var(--line);border-radius:19px;background:#171c2e}.nav{display:grid;gap:7px}.nav button,.btn,.pill{font:inherit;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:10px 15px;cursor:pointer}.nav button{text-align:left;border:0;background:transparent;color:var(--muted);font-weight:750}.nav button.active,.nav button:hover{background:var(--panel2);color:white}.btn.primary{background:var(--purple);color:#17142b;border:0;font-weight:850}.btn:disabled{opacity:.4;cursor:not-allowed}.side-note{margin-top:20px;padding:13px;border-radius:13px;background:#292645;color:#ddd8ff;font-size:15px;line-height:1.65}.main{min-width:0}.hero{padding:30px;border:1px solid #454064;border-radius:23px;background:linear-gradient(120deg,#30284d,#1d3040);margin-bottom:20px}.eyebrow{font-size:14px;text-transform:uppercase;letter-spacing:.15em;color:#c9c0ff;font-weight:850}.hero h1{font-size:clamp(34px,5vw,55px);line-height:1.12;letter-spacing:-.04em;margin:8px 0 13px}.hero p{max-width:780px;color:#e0deee;margin:0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 25px}.stat,.card,.chapter,.lesson,.read,.quiz,.result{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.stat span{display:block;color:var(--muted);font-size:15px}.stat strong{font-size:29px}.section{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:25px 0 14px}.section h2{margin:0;font-size:27px;line-height:1.3}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.chapter h3,.lesson h3{margin:0;font-size:21px;line-height:1.4}.chapter p{font-size:16px;line-height:1.65;color:var(--muted);margin:9px 0 13px}.tag{font-size:13px;color:#d3ccff;background:#302c50;border-radius:99px;padding:4px 9px;white-space:nowrap}.bar{height:8px;background:#333b52;border-radius:99px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--mint))}.foot,.progressline{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:14px}.search{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;color:white;font:inherit}.lessonlist{display:grid;gap:10px}.lesson{display:flex;align-items:center;justify-content:space-between;gap:14px}.lesson small{color:var(--muted);font-size:14px}.back{margin-bottom:15px}.lessonhero{padding:25px;background:var(--panel);border:1px solid var(--line);border-radius:20px;margin-bottom:17px}.lessonhero h1{font-size:clamp(30px,4vw,44px);line-height:1.2;margin:6px 0 12px}.read{padding:23px;margin:14px 0;background:#1d2639;border-color:#3a4862}.read h2{font-size:25px;line-height:1.35;margin:0 0 10px}.read p{font-size:22px;line-height:1.95;margin:8px 0 15px;max-width:900px}.code{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1221;border:1px solid #35405a;border-radius:14px;padding:17px;font:18px/1.8 ui-monospace,Consolas,monospace;color:#cceaff}.tip{padding:13px 16px;background:#17302f;border-left:4px solid var(--mint);border-radius:9px;margin-top:15px}.quiz{margin-top:16px}.quiz h2{font-size:27px;margin:0}.question{font-size:23px;line-height:1.7;margin:17px 0}.answers{display:grid;gap:10px}.answer{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:#252d45;color:white;font:inherit;line-height:1.55;cursor:pointer}.answer.selected{border-color:var(--purple);background:#332d55}.answer.correct{border-color:var(--green);background:#18372f}.answer.wrong{border-color:var(--red);background:#3a202c}.letter{width:30px;height:30px;flex-shrink:0;border-radius:9px;background:#39435f;display:grid;place-items:center;font-size:15px;font-weight:900}.feedback{padding:14px;border-radius:12px;background:#26334b;margin:14px 0}.feedback.good{background:#18372f;color:#c4ffe2}.feedback.bad{background:#3a202c;color:#ffd6dc}.quizactions{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.result{text-align:center;padding:30px}.score{font-size:67px;font-weight:950;color:var(--mint);line-height:1.2}.result h2{font-size:31px}.hidden{display:none!important}.toggle{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:7px}.empty{text-align:center;padding:25px;color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:14px;padding:30px}body.compact{font-size:18px;line-height:1.65}body.compact .read p{font-size:19px}body.compact .question{font-size:20px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center}.side-note{display:none}}@media(max-width:620px){.app{padding:13px}.top{align-items:flex-start}.top .toolbar{margin:0}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero{padding:22px}.hero p{font-size:18px}.read{padding:17px}.read p{font-size:19px}.lesson{align-items:flex-start}.nav{grid-template-columns:repeat(3,1fr)}}

<body><div class="app">
<header class="top"><div class="brand"><div class="logo">C#</div><div>C# <span style="color:var(--mint)">ACADEMY</span><div class="small muted" style="font-weight:500">Learn a little. Build a lot.</div></div></div><div class="toolbar" style="margin:0"><label class="toggle"><input id="easyRead" type="checkbox" checked> Easy reading</label><button class="pill" id="reset">Reset progress</button></div></header>
<div class="layout"><aside class="side"><nav class="nav"><button class="active" data-page="home">⌂ &nbsp; Dashboard</button><button data-page="catalog">▦ &nbsp; All chapters</button><button data-page="exam">★ &nbsp; Final exam</button></nav><div class="side-note"><strong>Take your time.</strong><br>Read one short part at a time. Then answer the questions. You can learn at your own pace.</div></aside><main class="main" id="main"></main></div><div class="footer">C# Academy · Progress is saved in this browser.</div></div>
<script>
const names=["Getting started with C#","Variables","Integers","Floating point numbers","Booleans","Strings","Characters","Constants","Variable scope","Type conversion","Math operators","Order of operations","Increment and decrement","Compound assignment","Comparisons","If statements","Else and else if","Logical AND and OR","The NOT operator","Switch statements","While loops","For loops","Do while loops","Break and continue","Methods","Method parameters","Return values","Method overloading","Optional arguments","Arrays","Lists","List indexing","Foreach loops","Multidimensional arrays","Dictionaries","Enums","Structs","Classes","Objects and instances","Fields and properties","Constructors","Access modifiers","Inheritance","Polymorphism","Virtual and override","Interfaces","Abstract classes","Static members","Namespaces","Using directives","Null values","Nullable types","Null conditional operators","Exceptions","TryParse","Debugging basics","Debug.Log","Console output","String interpolation","String methods","String comparison","Number formatting","Mathf basics","Random values","Vectors","Vector operations","Vector normalization","Quaternion rotation","Time.deltaTime","Transform position","Transform rotation","Transform scale","GameObjects","Components","MonoBehaviour","Awake and Start","Update and FixedUpdate","OnEnable and OnDisable","SerializeField","Inspector attributes","Rigidbody basics","AddForce","Colliders","Triggers","Raycasts","Layer masks","Coroutines","Invoke and CancelInvoke","Events and delegates","Action and Func","Lambda expressions","LINQ basics","Generics","Extension methods","Records","Pattern matching","Tuples","File input and output","JSON basics","Saving game data","ScriptableObjects","SceneManager","Input basics","New Input System","UI buttons","UI text","Object references","Instantiate","Destroy","GetComponent","Tags","Singleton pattern","State machines","Object pooling","Performance","Async and await","Tasks","Threads and main thread","Garbage collection","Debug drawing","Assertions","Unit testing","Test-driven thinking","Clean code and naming","Refactoring","Comments and documentation","SOLID principles","Dependency injection","Composition over inheritance","Unity events","Script execution order","Physics materials","Character movement","Camera control","Animation parameters","Audio playback","Networking fundamentals","Security and validation","Project structure","Compiler errors","Runtime errors","Algorithms","Searching algorithms","Sorting algorithms","Recursion","Big O basics","Bitwise operators","Flags enums","Custom operators","Reflection","Attributes","Preprocessor directives","Assemblies and packages","Editor scripting","Custom inspectors","Gizmos","Build settings","Platform differences","Localization","Game accessibility","Game architecture","Factory pattern","Observer pattern","Strategy pattern","Command pattern","Procedural generation","Grid algorithms","Pathfinding","Input rebinding","Profiling tools"];
const stages=["First look","The building blocks","Read the code","Choose the right tool","Change a value","Find the mistake","Combine ideas","Unity connection","Think like a programmer","Mastery practice"];
const groups=["C# basics","Data","Math","Logic","Loops","Methods","Collections","Types","OOP","Structure","Safety","Debugging","Unity","Unity math","Physics","C# advanced","Text","Files","Unity UI","Patterns","Performance","Testing","Code quality","Architecture","Algorithms","Advanced","Unity Editor","Design"];
const explanations=[
["A program is a set of instructions. C# reads the instructions and performs them in order.","Look at the example one line at a time. Identify the names, values, and symbols before predicting what happens."],
["A variable is a named place for a value. Its type tells C# what kind of information it can store.","Give variables useful names. Read the type first, then the name, then the value being assigned."],
["C# features are tools for solving particular problems. Understand the purpose before memorizing syntax.","Read the example slowly. Ask what information goes in, what happens, and what result comes out."],
["A condition is an expression that evaluates to true or false. Programs use conditions to make decisions.","Check each condition carefully. A small symbol change can make a completely different result."],
["A loop repeats instructions. The condition and update decide how many times it runs.","Trace the first repetition, then the next. Always check what makes the loop stop."],
["A method is a named block of reusable instructions. Parameters provide inputs and return values provide results.","Find the method name, its inputs, its return type, and the instructions inside it."],
["A collection stores multiple values. Indexes often start at zero, and each collection has its own rules.","Check the collection type, its size, and the index before reading or changing an item."],
["Types describe what kind of value something represents. They help C# catch invalid operations.","A type affects which values and operations are allowed. Do not confuse a number with text."],
["Object-oriented programming groups data and behavior into types and objects.","Look for the class, the object created from it, and the members being used."],
["Good structure makes code easier to find, read, reuse, and maintain.","Use clear names and keep related code together. Avoid putting an entire project into one giant method."],
["Safe code checks assumptions and handles situations that may not work as expected.","Check references, inputs, and possible errors before using a value."],
["Debugging means finding the real cause of a problem instead of guessing.","Read the error, inspect the line, and check the values at that moment."],
["Unity scripts interact with GameObjects, components, scenes, and the game engine.","Know which object owns the component and which Unity event method is running."],
["Math in Unity often uses vectors, rotations, and helper functions.","Track the values and coordinate space. World space and local space are not the same."],
["Physics systems detect collisions and control physical movement.","Use the correct physics component and understand when physics updates happen."],
["Advanced C# features can make code more flexible, but they should make the program clearer.","Learn the basic idea first, then inspect the syntax and the effect of each expression."],
["Text values can be joined, compared, searched, and formatted.","Strings contain text. Remember the difference between single quotes for char and double quotes for string."],
["Files and saved data let a program keep information beyond one moment.","Think about the file path, the format, and what happens if the file is missing or invalid."],
["User interface code connects player actions to visible controls and text.","Separate the display from the game logic and check which component owns the UI element."],
["Design patterns are common ways to organize code around a recurring problem.","A pattern is a tool, not a rule. Choose it only when it makes the design simpler."],
["Performance work reduces unnecessary work and makes a program run smoothly.","Measure before optimizing. Repeated work in every frame can become expensive."],
["Testing checks whether code behaves as expected.","Write down the expected result, run the test, and compare the actual result."],
["Readable code helps people understand and safely change a program.","Names should explain purpose. Small methods are easier to understand and test."],
["Architecture describes how different parts of a program are divided and communicate.","Keep responsibilities clear and avoid making every system depend on every other system."],
["Algorithms are step-by-step ways to solve problems.","Describe the steps first, then test normal cases and unusual edge cases."],
["Advanced tools give more control but require careful understanding.","Focus on what the feature changes and when it is appropriate to use."],
["Editor tools extend the Unity Editor and help developers work faster.","Editor-only code must stay separate from runtime code."],
["Game design includes making systems understandable and usable for different players.","Consider clarity, feedback, controls, and the player's experience."]
];
function category(i){return groups[Math.min(groups.length-1,Math.floor(i/Math.max(1,names.length/groups.length)))];}
function example(i){let n=names[i];if(i===1)return "int score = 10;\nscore = score + 5;";if(i===10)return "int total = 8 + 4;\nint remainder = 9 % 4;";if(i===15)return "if (health <= 0)\n{\n    Console.WriteLine(\"Game over\");\n}";if(i===21)return "for (int i = 0; i < 3; i++)\n{\n    Console.WriteLine(i);\n}";if(i===29)return "int[] scores = { 4, 8, 12 };\nint first = scores[0];";if(i===24)return "int Add(int a, int b)\n{\n    return a + b;\n}";if(i===55)return "Debug.Log(\"Door opened\");\nDebug.Log(score);";if(i===68)return "transform.position += Vector3.forward * speed * Time.deltaTime;";if(i===73)return "Rigidbody body = GetComponent<Rigidbody>();";if(i===84)return "if (Physics.Raycast(transform.position, transform.forward, out RaycastHit hit, 10f))\n{\n    Debug.Log(hit.collider.name);\n}";return "// "+n+" example\nint value = 5;\nvalue += 2;";}
function detail(i,stage){let e=explanations[Math.min(explanations.length-1,Math.floor(i*explanations.length/names.length))];return e[stage%2];}
const courses=names.flatMap((name,ci)=>stages.map((s,li)=>({id:ci*10+li,chapter:ci,title:name+" · "+s,desc:["Learn the main idea.","Understand the important parts.","Read a real code example.","Choose when this feature is useful.","Predict how a value changes.","Find and fix a common mistake.","Combine it with earlier skills.","Connect the idea to Unity.","Solve a harder problem.","Show that you understand it."][li],difficulty:Math.min(100,Math.round(2+ci*.76+li*1.2))})));
let data;try{data=JSON.parse(localStorage.getItem("cacademy-v1"))||{scores:{},xp:0,attempts:{}}}catch(e){data={scores:{},xp:0,attempts:{}}}
let page="home",chapterId=0,courseId=0,quiz=null,exam=null,query="";
const main=document.getElementById("main");
function save(){localStorage.setItem("cacademy-v1",JSON.stringify(data))}
function passed(){return Object.values(data.scores).filter(x=>x>=70).length}
function chapterDone(i){let n=0;for(let j=0;j<10;j++)if((data.scores[i*10+j]||0)>=70)n++;return n}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function nav(p){page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
function card(i){return '<article class="chapter"><div class="foot"><span class="tag">'+esc(category(i))+'</span><span>'+(i+1)+'/100</span></div><h3>'+esc(names[i])+'</h3><p>'+esc(detail(i,0))+'</p><div class="bar"><i style="width:'+chapterDone(i)*10+'%"></i></div><div class="foot"><span>'+chapterDone(i)+'/10 courses passed</span><button class="btn" data-chapter="'+i+'">Open →</button></div></article>'}
function wireChapters(){document.querySelectorAll("[data-chapter]").forEach(b=>b.onclick=()=>{chapterId=+b.dataset.chapter;nav("chapter")})}
function home(){let avg=Object.values(data.scores).length?Math.round(Object.values(data.scores).reduce((a,b)=>a+b,0)/Object.values(data.scores).length):0;main.innerHTML='<section class="hero"><div class="eyebrow">Your coding journey starts here</div><h1>Learn C#.<br>One clear step at a time.</h1><p>Short explanations. Real code. Different kinds of questions. Build your skills from your first variable to advanced Unity systems.</p><div class="toolbar"><button class="btn primary" id="continue">Continue learning →</button><button class="btn" id="browse">Explore chapters</button></div></section><div class="stats"><div class="stat"><span>Courses passed</span><strong>'+passed()+' / 1000</strong></div><div class="stat"><span>XP earned</span><strong>'+data.xp+'</strong></div><div class="stat"><span>Average score</span><strong>'+avg+'%</strong></div><div class="stat"><span>Chapters</span><strong>100</strong></div></div><div class="section"><div><div class="eyebrow">Start with the basics</div><h2>Your learning path</h2></div><button class="btn" id="all">All chapters →</button></div><div class="grid">'+names.slice(0,6).map((n,i)=>card(i)).join("")+'</div><div class="section"><h2>Final mastery exam</h2></div><div class="card"><h3>Can you use C# on your own?</h3><p class="muted">The final exam checks your understanding across the curriculum. If you do not pass, it recommends topics to practise.</p><button class="btn primary" id="examBtn">Open final exam →</button></div>';document.getElementById("continue").onclick=()=>openCourse(findNext());document.getElementById("browse").onclick=()=>nav("catalog");document.getElementById("all").onclick=()=>nav("catalog");document.getElementById("examBtn").onclick=()=>nav("exam");wireChapters()}
function catalog(){main.innerHTML='<div class="eyebrow">The complete curriculum</div><h1 style="font-size:40px;line-height:1.2;margin:5px 0">100 chapters. 1000 courses.</h1><p class="muted">Search for a topic or explore the full learning path.</p><div class="toolbar"><input class="search" id="search" placeholder="Search variables, math, Unity, loops..." value="'+esc(query)+'"><span class="pill">100 chapters</span><span class="pill">1000 courses</span></div><div class="grid" id="catalogGrid"></div>';let input=document.getElementById("search");function update(){query=input.value;let ids=names.map((n,i)=>i).filter(i=>(names[i]+" "+category(i)).toLowerCase().includes(query.toLowerCase()));document.getElementById("catalogGrid").innerHTML=ids.length?ids.map(card).join(""):'<div class="empty">No chapters found.</div>';wireChapters()}input.oninput=update;update()}
function chapter(){main.innerHTML='<button class="btn back" id="back">← All chapters</button><section class="lessonhero"><div class="eyebrow">Chapter '+(chapterId+1)+' of 100 · '+esc(category(chapterId))+'</div><h1>'+esc(names[chapterId])+'</h1><p class="muted">'+esc(detail(chapterId,0))+'</p><div class="bar"><i style="width:'+chapterDone(chapterId)*10+'%"></i></div><div class="progressline"><span>'+chapterDone(chapterId)+' of 10 passed</span><span>10 courses</span></div></section><div class="section"><h2>Courses in this chapter</h2><span class="tag">Easy to advanced</span></div><div class="lessonlist">'+courses.filter(c=>c.chapter===chapterId).map(c=>'<article class="lesson"><div><h3>'+esc(c.title)+'</h3><small>Difficulty '+c.difficulty+'/100 · '+(data.scores[c.id]>=70?'Passed · '+data.scores[c.id]+'%':data.scores[c.id]!=null?'Last score: '+data.scores[c.id]+'%':'Not completed')+'</small></div><button class="btn '+(data.scores[c.id]>=70?'':'primary')+'" data-course="'+c.id+'">'+(data.scores[c.id]>=70?'Review':'Start')+' →</button></article>').join("")+'</div>';document.getElementById("back").onclick=()=>nav("catalog");document.querySelectorAll("[data-course]").forEach(b=>b.onclick=()=>openCourse(+b.dataset.course))}
function findNext(){let c=courses.find(c=>(data.scores[c.id]||0)<70);return c?c.id:0}
function openCourse(id){courseId=id;quiz=null;page="course";render()}
function makeQuestions(c){let ci=c.chapter,topic=names[ci],basic=[
{type:"Multiple choice",q:"What is the main purpose of "+topic.toLowerCase()+"?",a:["To solve a particular programming problem clearly","To make every program run faster automatically","To remove the need to test code","To replace all other C# features"],correct:0,why:"Every C# feature has a purpose. Learn what it does and when it is useful."},
{type:"Code reading",q:"What should you identify first when reading this example?",code:example(ci),a:["The types, names, and operations","Only the last character","The colour of the text","Nothing; code cannot be read step by step"],correct:0,why:"Read the type, name, value, and operation carefully."},
{type:"Spot what is wrong",q:"Which habit helps prevent mistakes?",a:["Use clear names and check what each line does","Guess what the compiler will do","Ignore types and warnings","Delete every condition"],correct:0,why:"Careful reading and clear intent make code easier to check."},
{type:"True or false",q:"You should test code with more than one input or situation.",a:["True","False"],correct:0,why:"Different situations can reveal mistakes that one example does not show."},
{type:"Debug output",q:"What does this code print?",code:"Console.WriteLine(4 + 3 * 2);",a:["14","10","11","8"],correct:1,why:"Multiplication happens first: 4 + 6 is 10."},
{type:"Find the value",q:"What is the value of result?",code:"int number = 6;\nint result = number + 4;",a:["6","4","10","64"],correct:2,why:"6 + 4 gives 10."},
{type:"Multiple choice",q:"What is the best way to learn a new C# feature?",a:["Read it, predict what happens, then test it","Memorize one line without understanding it","Skip errors and hope it works","Never change the example"],correct:0,why:"Understanding grows when you connect the explanation to code and test it."},
{type:"Spot what is wrong",q:"Your program gives an unexpected result. What should you do first?",a:["Read the relevant lines and inspect the values","Rewrite the whole project immediately","Assume the computer is wrong","Remove all variables"],correct:0,why:"Start with evidence: the line, the value, and the order of execution."}
];if(ci===1)basic[5]={type:"Find the value",q:"What is the value of score after these lines?",code:"int score = 10;\nscore = score + 5;",a:["10","5","15","105"],correct:2,why:"10 plus 5 is 15."};if(ci===10)basic[5]={type:"Find the value",q:"What is the value of remainder?",code:"int remainder = 11 % 4;",a:["2","3","4","7"],correct:1,why:"11 divided by 4 leaves a remainder of 3."};if(ci===15)basic[5]={type:"Spot what is wrong",q:"Find the mistake in this code:",code:"if (health = 0)\n{\n    GameOver();\n}",a:["Use == to compare instead of =","Braces are always illegal","health must be a string","GameOver must be a variable"],correct:0,why:"A single = assigns a value. == compares two values."};if(ci===21)basic[5]={type:"Debug output",q:"What is printed by this loop?",code:"for (int i = 0; i < 3; i++)\n    Console.Write(i);",a:["123","012","0123","321"],correct:1,why:"The loop prints 0, 1, and 2. It stops when i reaches 3."};if(ci===29)basic[5]={type:"Multiple choice",q:"What is the first index in a C# array?",code:"int[] scores = { 4, 8, 12 };",a:["0","1","2","3"],correct:0,why:"C# arrays use zero-based indexing."};if(ci===68)basic[5]={type:"Multiple choice",q:"Why multiply movement by Time.deltaTime?",a:["To make movement more consistent across frame rates","To make an object teleport","To convert a vector into text","To disable physics"],correct:0,why:"deltaTime scales movement by the time between frames."};return basic.map((q,i)=>Object.assign({id:i},q))}
function course(){let c=courses[courseId],ci=c.chapter;if(quiz){quizView(c);return}main.innerHTML='<button class="btn back" id="back">← '+esc(names[ci])+'</button><section class="lessonhero"><div class="eyebrow">Course '+(c.id+1)+' of 1000 · Chapter '+(ci+1)+'</div><h1>'+esc(c.title)+'</h1><p class="muted">'+esc(c.desc)+'</p><div class="progressline"><span>Difficulty</span><strong>'+c.difficulty+'/100</strong></div></section><section class="read"><div class="eyebrow">01 · Understand</div><h2>'+esc(names[ci])+' in simple words</h2><p>'+esc(detail(ci,c.id%10))+'</p><div class="tip"><strong>Remember:</strong> '+esc(c.desc)+' Try to explain the idea in your own words.</div></section><section class="read"><div class="eyebrow">02 · Read the code</div><h2>Look at the example slowly</h2><p>Read one line at a time. Notice the names, symbols, and values.</p><pre class="code">'+esc(example(ci))+'</pre><div class="tip">Ask yourself: what happens first? Which values change? What is the result?</div></section><section class="read"><div class="eyebrow">03 · Show what you know</div><h2>Answer the questions</h2><p>Different question types will test how well you understand the code. You get feedback after every answer.</p><ul><li>Read the full question.</li><li>Look at every answer.</li><li>Use the example if you need help.</li></ul><button class="btn primary" id="start">Start questions →</button></section>';document.getElementById("back").onclick=()=>nav("chapter");document.getElementById("start").onclick=()=>{quiz={index:0,answers:{},checked:{},score:0};render()}}
function quizView(c){let qs=makeQuestions(c),q=qs[quiz.index],chosen=quiz.answers[q.id],checked=quiz.checked[q.id];main.innerHTML='<button class="btn back" id="exit">← Back to lesson</button><div class="progressline"><span>Question '+(quiz.index+1)+' of '+qs.length+'</span><span>Difficulty '+c.difficulty+'/100</span></div><div class="bar"><i style="width:'+((quiz.index+1)/qs.length*100)+'%"></i></div><section class="quiz"><div class="eyebrow">'+esc(q.type)+'</div><h2>Question '+(quiz.index+1)+'</h2><div class="question">'+esc(q.q)+'</div>'+(q.code?'<pre class="code">'+esc(q.code)+'</pre>':'')+'<div class="answers">'+q.a.map((a,i)=>'<button class="answer '+(chosen===i?'selected ':'')+(checked?(i===q.correct?'correct':chosen===i?'wrong':''):'')+'" data-answer="'+i+'" '+(checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(a)+'</span></button>').join("")+'</div>'+(checked?'<div class="feedback '+(chosen===q.correct?'good':'bad')+'"><strong>'+(chosen===q.correct?'Correct!':'Not quite.')+'</strong><br>'+esc(q.why)+'</div>':'')+'<div class="quizactions"><span class="muted small">'+(checked?'Answer checked':'Choose one answer')+'</span><button class="btn primary" id="next" '+(chosen==null?'disabled':'')+'>'+(checked?(quiz.index===qs.length-1?'See result':'Next question →'):'Check answer')+'</button></div></section>';document.getElementById("exit").onclick=()=>{quiz=null;render()};document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{if(!checked){quiz.answers[q.id]=+b.dataset.answer;render()}});document.getElementById("next").onclick=()=>{if(!checked){quiz.checked[q.id]=true;if(chosen===q.correct)quiz.score++;render()}else if(quiz.index<qs.length-1){quiz.index++;render()}else finishCourse(c,qs)}}
function finishCourse(c,qs){let score=Math.round(quiz.score/qs.length*100);data.scores[c.id]=Math.max(data.scores[c.id]||0,score);data.attempts[c.id]=(data.attempts[c.id]||0)+1;data.xp+=quiz.score*10;save();let got=quiz.score;quiz=null;let ok=score>=70;main.innerHTML='<section class="result"><div class="eyebrow">Course result</div><div class="score">'+score+'%</div><h2>'+(ok?'Course passed!':'Good practice. Keep going!')+'</h2><p class="muted">'+got+' of '+qs.length+' answers correct.</p><div class="bar"><i style="width:'+score+'%"></i></div><p>'+(ok?'This course is marked as passed. You can review it or continue.':'You need 70% to pass. Read the lesson again and try another attempt.')+'</p><div class="toolbar" style="justify-content:center"><button class="btn" id="review">Review lesson</button><button class="btn primary" id="again">Try again</button><button class="btn" id="nextCourse">Next course →</button></div></section>';document.getElementById("review").onclick=()=>openCourse(c.id);document.getElementById("again").onclick=()=>{openCourse(c.id);setTimeout(()=>document.getElementById("start")?.click(),0)};document.getElementById("nextCourse").onclick=()=>openCourse(ok?Math.min(999,c.id+1):c.id)}
function examPage(){let weak=names.map((n,i)=>({n,i,p:chapterDone(i)})).filter(x=>x.p<7).sort((a,b)=>a.p-b.p).slice(0,5);main.innerHTML='<section class="hero"><div class="eyebrow">The final challenge</div><h1>Show what you know.</h1><p>This is a mixed exam across C#. It checks whether you can read code, predict results, find mistakes, and choose the right approach.</p></section><div class="stats"><div class="stat"><span>Courses passed</span><strong>'+passed()+'/1000</strong></div><div class="stat"><span>Chapters started</span><strong>'+names.filter((n,i)=>chapterDone(i)>0).length+'/100</strong></div><div class="stat"><span>Pass mark</span><strong>80%</strong></div><div class="stat"><span>Exam questions</span><strong>30</strong></div></div><div class="card"><h2>Before you begin</h2><p class="muted">You need 80% or higher to finish. If you do not pass, the result will recommend chapters and courses to practise.</p><button class="btn primary" id="begin">Start final exam →</button></div><div class="section"><h2>Suggested practice</h2></div><div class="lessonlist">'+weak.map(x=>'<article class="lesson"><div><h3>'+esc(x.n)+'</h3><small>'+x.p+'/10 courses passed</small></div><button class="btn" data-practice="'+x.i+'">Practise →</button></article>').join("")+'</div>';document.getElementById("begin").onclick=startExam;document.querySelectorAll("[data-practice]").forEach(b=>b.onclick=()=>{chapterId=+b.dataset.practice;nav("chapter")})}
function startExam(){let pool=[];for(let i=0;i<names.length;i++){let c=courses[i*10+Math.floor(Math.random()*10)];pool.push(...makeQuestions(c).slice(0,3).map(q=>Object.assign({topic:i},q)))}pool.sort(()=>Math.random()-.5);exam={pool:pool.slice(0,30),index:0,answers:{},checked:{},score:0};examView()}
function examView(){let q=exam.pool[exam.index];main.innerHTML='<button class="btn back" id="leave">← Exit exam</button><div class="progressline"><span>Final exam · Question '+(exam.index+1)+'/30</span><span>Pass mark 80%</span></div><div class="bar"><i style="width:'+((exam.index+1)/30*100)+'%"></i></div><section class="quiz"><div class="eyebrow">Topic: '+esc(names[q.topic])+'</div><h2>Final exam question</h2><div class="question">'+esc(q.q)+'</div>'+(q.code?'<pre class="code">'+esc(q.code)+'</pre>':'')+'<div class="answers">'+q.a.map((a,i)=>'<button class="answer '+(exam.answers[exam.index]===i?'selected ':'')+(exam.checked[exam.index]?(i===q.correct?'correct':exam.answers[exam.index]===i?'wrong':''):'')+'" data-ea="'+i+'" '+(exam.checked[exam.index]?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(a)+'</span></button>').join("")+'</div>'+(exam.checked[exam.index]?'<div class="feedback">'+esc(q.why)+'</div>':'')+'<div class="quizactions"><span class="muted small">'+(exam.checked[exam.index]?'Answer checked':'Choose one answer')+'</span><button class="btn primary" id="enext" '+(exam.answers[exam.index]==null?'disabled':'')+'>'+(exam.checked[exam.index]?(exam.index===29?'Finish exam':'Next →'):'Check answer')+'</button></div></section>';document.getElementById("leave").onclick=()=>{exam=null;nav("exam")};document.querySelectorAll("[data-ea]").forEach(b=>b.onclick=()=>{if(!exam.checked[exam.index]){exam.answers[exam.index]=+b.dataset.ea;examView()}});document.getElementById("enext").onclick=()=>{if(!exam.checked[exam.index]){exam.checked[exam.index]=true;if(exam.answers[exam.index]===q.correct)exam.score++;examView()}else if(exam.index<29){exam.index++;examView()}else endExam()}}
function endExam(){let pct=Math.round(exam.score/30*100),weak={};exam.pool.forEach((q,i)=>{if(exam.answers[i]!==q.correct)weak[q.topic]=(weak[q.topic]||0)+1});let list=Object.entries(weak).sort((a,b)=>b[1]-a[1]).slice(0,6);exam=null;main.innerHTML='<section class="result"><div class="eyebrow">Final exam result</div><div class="score">'+pct+'%</div><h2>'+(pct>=80?'You passed the final exam!':'Not quite — here is your practice plan.')+'</h2><p class="muted">You answered '+Math.round(pct/100*30)+' of 30 questions correctly. '+(pct>=80?'You completed the final challenge.':'You need at least 80% to pass.')+'</p><div class="bar"><i style="width:'+pct+'%"></i></div><h3>Topics to practise</h3><div class="lessonlist">'+(list.length?list.map(x=>'<article class="lesson"><div><h3>'+esc(names[+x[0]])+'</h3><small>'+x[1]+' question(s) to review</small></div><button class="btn" data-weak="'+x[0]+'">Open chapter →</button></article>').join(""):'<p class="muted">No weak topics found. Great work!</p>')+'</div><div class="toolbar" style="justify-content:center"><button class="btn primary" id="againExam">Try exam again</button><button class="btn" id="homeBtn">Dashboard</button></div></section>';document.querySelectorAll("[data-weak]").forEach(b=>b.onclick=()=>{chapterId=+b.dataset.weak;nav("chapter")});document.getElementById("againExam").onclick=startExam;document.getElementById("homeBtn").onclick=()=>nav("home")}
function render(){if(page==="home")home();else if(page==="catalog")catalog();else if(page==="chapter")chapter();else if(page==="course")course();else if(page==="exam")examPage()}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>nav(b.dataset.page));
document.getElementById("easyRead").onchange=e=>document.body.classList.toggle("compact",!e.target.checked);
document.getElementById("reset").onclick=()=>{if(confirm("Reset all saved scores and XP? This cannot be undone.")){localStorage.removeItem("cacademy-v1");location.reload()}};
render();
</script></body></html>
